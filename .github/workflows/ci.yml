name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ":core unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # :core is pure Kotlin/JVM. Running it through the standalone harness keeps this job
      # independent of the Android SDK, so game-logic regressions surface in seconds.
      - name: Run core tests
        run: GRADLE_CMD="$PWD/gradlew" scripts/test-core.sh --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: /tmp/pushup-core-standalone/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: "Android debug build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The listing is unconditional: this project was scaffolded without access to Google's
      # Maven, and guessing package names off release notes has now cost two CI rounds. The
      # platform carries a minor suffix from API 37 onward (android-37.0, not android-37), and
      # the build-tools version is read off the list rather than assumed.
      - name: Install SDK platform
        run: |
          echo "::group::Platforms and build-tools available to this runner"
          sdkmanager --list 2>/dev/null \
            | grep -oE "(platforms;android|build-tools);[0-9][0-9.]*" | sort -uV
          echo "::endgroup::"
          sdkmanager "platforms;android-37.0"
          BUILD_TOOLS=$(sdkmanager --list 2>/dev/null \
            | grep -oE "build-tools;37[0-9.]*" | sort -uV | tail -1)
          if [ -n "$BUILD_TOOLS" ]; then
            sdkmanager "$BUILD_TOOLS"
          else
            echo "No build-tools;37.x published yet; letting AGP pick its default."
          fi

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
