name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ":core unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # :core is pure Kotlin/JVM. Running it through the standalone harness keeps this job
      # independent of the Android SDK, so game-logic regressions surface in seconds.
      - name: Run core tests
        run: GRADLE_CMD="$PWD/gradlew" scripts/test-core.sh --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: /tmp/pushup-core-standalone/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: "Android debug build"
    runs-on: ubuntu-latest
    # Only for the "Publish debug APK" step below; everything else here is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages: is not optional. The action's default is "tools platform-tools", and Google
      # removed the legacy `tools` package from its repository between 2026-09-14 and 2026-09-17 —
      # this build went from green to failing in ten seconds with no change to the code. Asking for
      # platform-tools alone skips the package that no longer exists.
      # https://github.com/android-actions/setup-android/issues/537
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # The listing is unconditional: this project was scaffolded without access to Google's
      # Maven, and guessing package names off release notes has now cost two CI rounds. The
      # platform carries a minor suffix from API 37 onward (android-37.0, not android-37), and
      # the build-tools version is read off the list rather than assumed.
      - name: Install SDK platform
        run: |
          echo "::group::Platforms and build-tools available to this runner"
          sdkmanager --list 2>/dev/null \
            | grep -oE "(platforms;android|build-tools);[0-9][0-9.]*" | sort -uV
          echo "::endgroup::"
          sdkmanager "platforms;android-37.0"
          BUILD_TOOLS=$(sdkmanager --list 2>/dev/null \
            | grep -oE "build-tools;37[0-9.]*" | sort -uV | tail -1)
          if [ -n "$BUILD_TOOLS" ]; then
            sdkmanager "$BUILD_TOOLS"
          else
            echo "No build-tools;37.x published yet; letting AGP pick its default."
          fi

      - name: Assemble debug
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Ppushup.buildId="${GITHUB_SHA::7}"

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts are login-gated zips, which makes installing on a phone a chore.
      # A prerelease asset has a plain public URL that any browser can fetch, so the tag stays
      # fixed at "debug" and the link never changes:
      #
      #   https://github.com/cjsdudwls1/push-up/releases/download/debug/pushup-rpg-debug.apk
      #
      # Deleted and recreated rather than clobbered, so the tag points at the commit that was
      # actually built instead of whichever one first created it.
      # Actions artifacts are login-gated zips, which makes installing on a phone a chore.
      # A prerelease asset has a plain public URL any browser can fetch, so the tag stays fixed at
      # "debug" and the link never changes:
      #
      #   https://github.com/cjsdudwls1/push-up/releases/download/debug/pushup-rpg-debug.apk
      #
      # Deleted and recreated rather than clobbered, so the tag points at the commit that was
      # actually built rather than whichever one first created it.
      - name: Publish debug APK for phone install
        if: github.ref == 'refs/heads/claude/pushup-rpg-app-2xnr4o'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ runner.temp }}/pushup-rpg-debug.apk
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete debug --yes --cleanup-tag || true
          gh release create debug "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "디버그 빌드 (폰에 바로 설치)" \
            --notes-file .github/debug-release-notes.md
          {
            echo "### 폰에 설치하기"
            echo ""
            echo "[pushup-rpg-debug.apk](https://github.com/cjsdudwls1/push-up/releases/download/debug/pushup-rpg-debug.apk)"
            echo ""
            echo "APK $(du -h "$APK" | cut -f1) · arm64-v8a"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
