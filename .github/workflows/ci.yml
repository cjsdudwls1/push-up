name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ":core unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # :core is pure Kotlin/JVM. Running it through the standalone harness keeps this job
      # independent of the Android SDK, so game-logic regressions surface in seconds.
      - name: Run core tests
        run: GRADLE_CMD="$PWD/gradlew" scripts/test-core.sh --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: /tmp/pushup-core-standalone/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: "Android debug build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Pinned to a platform that exists. This project was scaffolded without access to Google's
      # Maven, so the original compileSdk was a guess (37) and sdkmanager rejected it outright.
      # The listing on failure is what turns the next guess into a fact.
      - name: Install SDK platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || {
            echo "::group::Platforms this runner can actually install"
            sdkmanager --list 2>/dev/null | grep -E "^\s+(platforms;android|build-tools;)" | sort -u
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
