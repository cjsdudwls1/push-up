name: Release AAB

on:
  push:
    tags: ["v*"]
    # Every build that reaches the phone-install branch goes to Play's internal test track and on
    # to the closed test; a v* tag also goes to production (see the last step).
    branches: ["claude/pushup-rpg-app-2xnr4o"]
    # A change to the docs alone is not a build testers need to download (or Google to review).
    paths-ignore: ["docs/**", "**.md", "site/**"]
  workflow_dispatch:

# One upload at a time, in order: Play rejects a bundle whose version code is not higher than the
# last one it accepted.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    name: "Signed App Bundle"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot appear in an `if:`, so what is configured is read once here.
      - name: Check secrets
        id: have
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; cannot produce a signed bundle."
            exit 1
          else
            echo "::notice::No upload key yet (RELEASE_KEYSTORE_BASE64), so no signed bundle. See docs/RELEASE.md."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PLAY_JSON" ]; then
            echo "play=true" >> "$GITHUB_OUTPUT"
          else
            echo "play=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.have.outputs.sign == 'true'
        with:
          distribution: temurin
          java-version: "17"

      # packages: is not optional. The action's default is "tools platform-tools", and Google
      # removed the legacy `tools` package from its repository between 2026-09-14 and 2026-09-17 —
      # this build went from green to failing in ten seconds with no change to the code. Asking for
      # platform-tools alone skips the package that no longer exists.
      # https://github.com/android-actions/setup-android/issues/537
      - uses: android-actions/setup-android@v3
        if: steps.have.outputs.sign == 'true'
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        if: steps.have.outputs.sign == 'true'

      # Same as ci.yml: from API 37 the platform package carries a minor suffix, so
      # "platforms;android-37" is a name that is never published.
      - name: Install SDK platform
        if: steps.have.outputs.sign == 'true'
        run: |
          sdkmanager "platforms;android-37.0"
          BUILD_TOOLS=$(sdkmanager --list 2>/dev/null \
            | grep -oE "build-tools;37[0-9.]*" | sort -uV | tail -1)
          if [ -n "$BUILD_TOOLS" ]; then
            sdkmanager "$BUILD_TOOLS"
          fi

      # The keystore never lives in the repository. Store it base64-encoded in
      # secrets.RELEASE_KEYSTORE_BASE64 (`base64 -w0 upload.jks`) alongside its passwords.
      - name: Restore keystore
        if: steps.have.outputs.sign == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # 1000 + this workflow's run number: always higher than the last upload, whichever trigger
      # started it, and clear of the 1 a local build carries.
      - name: Bundle release
        if: steps.have.outputs.sign == 'true'
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_BANNER: ${{ secrets.ADMOB_BANNER }}
        run: |
          echo "VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          # Real ads for a production tag only; every other build keeps Google's sample ads.
          admob=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            for name in ADMOB_APP_ID ADMOB_REWARDED ADMOB_INTERSTITIAL ADMOB_BANNER; do
              if [[ -z "${!name}" ]]; then
                echo "::error::$name secret is not set; a production build would ship sample ads."
                exit 1
              fi
            done
            admob=(
              "-Ppushup.admob.appId=$ADMOB_APP_ID"
              "-Ppushup.admob.rewarded=$ADMOB_REWARDED"
              "-Ppushup.admob.interstitial=$ADMOB_INTERSTITIAL"
              "-Ppushup.admob.banner=$ADMOB_BANNER"
            )
          fi
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -Ppushup.versionCode=$((1000 + ${{ github.run_number }})) "${admob[@]}"

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload AAB
        if: steps.have.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # To the internal track, which updates testers' phones through the Play Store by itself.
      # Play refuses API uploads for an app until its first bundle has been uploaded by hand in
      # the Console; see docs/RELEASE.md. An app still in draft only takes draft releases — set the
      # repository variable PLAY_RELEASE_STATUS to "draft" until the first release is rolled out.
      # The release notes are distribution/whatsnew/whatsnew-ko-KR: reword it with the change.
      - name: Upload to Play (internal testing)
        if: steps.have.outputs.sign == 'true' && steps.have.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.cjsdudwls1.pushuprpg
          releaseFiles: app/build/outputs/bundle/release/*.aab
          releaseName: ${{ env.VERSION_CODE }}
          tracks: internal
          whatsNewDirectory: distribution/whatsnew
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      # The same bundle, not a rebuild, moves on from there (tools/play.py). The closed test gets
      # every build, after Google's review of it; set the variable PLAY_CLOSED_TRACK to none to
      # stop that.
      - uses: actions/setup-python@v5
        if: steps.have.outputs.sign == 'true' && steps.have.outputs.play == 'true'
        with:
          python-version: "3.12"

      - name: Set up Play tools
        if: steps.have.outputs.sign == 'true' && steps.have.outputs.play == 'true'
        run: pip install --quiet google-auth requests

      - name: Promote to closed testing
        if: >-
          steps.have.outputs.sign == 'true' && steps.have.outputs.play == 'true'
          && vars.PLAY_CLOSED_TRACK != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python tools/play.py promote --from internal --to "${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}" \
            --version-code "$VERSION_CODE" --notes-file distribution/whatsnew/whatsnew-ko-KR

      # Production only from a tag (git tag v0.2.0 && git push origin v0.2.0), rolled out to the
      # share PLAY_PRODUCTION_FRACTION names (e.g. 0.2) or to everyone when it is unset. A staged
      # rollout is widened with the Promote workflow. Needs production access in the Console.
      - name: Promote to production
        if: >-
          steps.have.outputs.sign == 'true' && steps.have.outputs.play == 'true'
          && github.ref_type == 'tag'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FRACTION: ${{ vars.PLAY_PRODUCTION_FRACTION }}
        run: |
          python tools/play.py promote --from internal --to production \
            --version-code "$VERSION_CODE" --notes-file distribution/whatsnew/whatsnew-ko-KR \
            ${FRACTION:+--fraction "$FRACTION"}
